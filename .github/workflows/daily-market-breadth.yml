name: Daily Market Breadth Analysis

on:
  schedule:
    # Post-market only: 6:00 PM EST / 7:00 PM EDT (23:00 UTC), after the close settles.
    # GitHub often starts scheduled runs hours late, so a local launchd job
    # (com.tradermonty.market-breadth-backup-trigger, 3:00 PM PT) dispatches this
    # workflow through trigger_market_breadth.py when the published CSV is stale.
    # A pre-market run was dropped: it could only republish the previous session.
    - cron: '0 23 * * 1-5'
  workflow_dispatch:  # Enable manual execution

# Set required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  keepalive:
    # Independent of analysis/deployment failures; only the default branch may write.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Keep scheduled workflow active
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/keep_workflow_active.sh "$DEFAULT_BRANCH"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version-file: '.python-version'

    - name: Set up pinned uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.17"

    - name: Install locked analysis dependencies
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/market-breadth-env
      run: |
        uv sync --locked --no-default-groups
        echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

    - name: Generate and validate fresh publication
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: >-
        python scripts/publish_market_breadth.py
        --output-dir "$RUNNER_TEMP/market-breadth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

    - name: Upload validation diagnostic
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: publication-validation
        path: ${{ runner.temp }}/market-breadth-${{ github.run_id }}-${{ github.run_attempt }}/validation.json
        if-no-files-found: warn
        retention-days: 7

    # Keep the published plain-English explainer (re-checked) so every deploy keeps its link.
    # Trusted repo code only; it can never block the chart publication.
    - name: Carry forward breadth explainer
      continue-on-error: true
      run: >-
        python scripts/breadth_explainer.py carry-forward
        --site-dir "$RUNNER_TEMP/market-breadth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ runner.temp }}/market-breadth-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------------------
  # Plain-English explainer (breadth_explained.html), written by Claude from the Market
  # Breadth Analyzer + ELI5 skills. Optional and isolated from the chart publication:
  #   explainer-analyze - pinned third-party analyzer; no secrets, read-only, no Pages
  #                       permissions. Hands only analysis.json/.md + facts.json onward.
  #   explainer         - Claude. Installs the CLI before touching any artifact, builds a
  #                       fresh workspace with trusted code, tools scoped to that workspace.
  #   explainer-publish - trusted repo code, no secrets: validates the page, adds a strict
  #                       CSP and redeploys the already-deployed site plus that one file.
  # Every step is non-blocking with its own timeout (sum < job timeout), so the run that
  # scripts/monitor_feed.py watches stays green; problems surface as ::warning:: annotations.
  # ---------------------------------------------------------------------------------------
  explainer-analyze:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      regenerate: ${{ steps.analyze.outputs.regenerate }}
    steps:
      - name: Checkout repository
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'

      - name: Install analyzer dependency
        continue-on-error: true
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check 'requests==2.34.2'

      - name: Download built site
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Extract fresh CSVs
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/site" \
            ./market_breadth_data.csv ./market_breadth_summary.csv

      - name: Check out Market Breadth Analyzer skill
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          repository: tradermonty/claude-trading-skills
          ref: d5fcca78c0d8c8294ca53cf49a1cfbb1162df2c7 # pragma: allowlist secret (pinned commit SHA)
          path: .explainer/claude-trading-skills
          sparse-checkout: skills/market-breadth-analyzer
          persist-credentials: false

      - name: Analyze breadth
        id: analyze
        continue-on-error: true
        timeout-minutes: 8
        run: >-
          python scripts/breadth_explainer.py analyze
          --csv-dir "$RUNNER_TEMP/site"
          --analyzer-dir .explainer/claude-trading-skills/skills/market-breadth-analyzer
          --out-dir "$RUNNER_TEMP/analysis"

      - name: Upload analysis
        if: steps.analyze.outputs.regenerate == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: breadth-analysis
          path: |
            ${{ runner.temp }}/analysis/analysis.json
            ${{ runner.temp }}/analysis/analysis.md
            ${{ runner.temp }}/analysis/facts.json
          if-no-files-found: warn
          retention-days: 7

  explainer:
    needs: explainer-analyze
    if: needs.explainer-analyze.outputs.regenerate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      # Only our own upload counts: a same-named artifact pre-created by an earlier job makes
      # this upload fail, and then nothing is published.
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      # Install the CLI first, before any artifact or third-party content is on the runner.
      - name: Install Claude Code CLI
        continue-on-error: true
        timeout-minutes: 5
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.330

      - name: Checkout repository
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'

      - name: Check out Market Breadth Analyzer skill
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          repository: tradermonty/claude-trading-skills
          ref: d5fcca78c0d8c8294ca53cf49a1cfbb1162df2c7 # pragma: allowlist secret (pinned commit SHA)
          path: .explainer/claude-trading-skills
          sparse-checkout: skills/market-breadth-analyzer
          persist-credentials: false

      - name: Check out ELI5 skill
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          repository: takusaotome/claude-skills-library
          ref: dd1fb14d0fc6937104657c9ff1770abc57e81683 # pragma: allowlist secret (pinned commit SHA)
          path: .explainer/claude-skills-library
          sparse-checkout: skills/eli5
          persist-credentials: false

      - name: Download analysis
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: breadth-analysis
          path: ${{ runner.temp }}/analysis

      - name: Prepare Claude workspace
        id: prepare
        continue-on-error: true
        timeout-minutes: 3
        run: >-
          python scripts/breadth_explainer.py prepare
          --analysis-dir "$RUNNER_TEMP/analysis"
          --analyzer-skill-dir .explainer/claude-trading-skills/skills/market-breadth-analyzer
          --eli5-dir .explainer/claude-skills-library/skills/eli5
          --work-dir "$RUNNER_TEMP/explainer"

      - name: Write explainer with Claude
        if: steps.prepare.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/explainer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXPLAINER_MODEL: claude-opus-5-5
        # Tools are scoped to this workspace: reads only inside it, writes only explainer.html.
        run: >-
          claude -p "$(cat prompt.md)" --model "$EXPLAINER_MODEL" --max-budget-usd 2
          --setting-sources project --permission-mode dontAsk
          --allowedTools "Read(./**),Glob,Skill,Write(./explainer.html),Edit(./explainer.html)"
          --disallowedTools "Bash,WebFetch,WebSearch,Task,NotebookEdit"
          || echo "::warning title=Breadth explainer::Claude step exited with $?"

      - name: Upload explainer
        id: upload
        if: steps.prepare.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: breadth-explainer
          path: |
            ${{ runner.temp }}/explainer/explainer.html
            ${{ runner.temp }}/explainer/facts.json
          if-no-files-found: warn
          retention-days: 7

  explainer-publish:
    needs: [build, deploy, explainer]
    if: needs.explainer.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/setup-python@v4
        with:
          python-version-file: '.python-version'

      - name: Download deployed site
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Download explainer
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: breadth-explainer
          path: ${{ runner.temp }}/explainer

      - name: Validate explainer
        id: finalize
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$RUNNER_TEMP/site"
          python scripts/breadth_explainer.py finalize \
            --site-dir "$RUNNER_TEMP/site" --work-dir "$RUNNER_TEMP/explainer"

      - name: Upload site with explainer
        id: upload
        if: steps.finalize.outputs.publish == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-explainer
          path: ${{ runner.temp }}/site
          retention-days: 1

      # Deploy only our own upload: if an earlier (untrusted) job had already created an
      # artifact with this name, our upload fails and nothing is deployed.
      - name: Redeploy GitHub Pages
        id: deploy
        if: steps.finalize.outputs.publish == 'true' && steps.upload.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-explainer

      # deploy-pages looks the artifact up about a second after the upload, and the API does
      # not always list it yet ("No artifacts named ..."). Wait, then retry once.
      - name: Wait before retrying redeploy
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        run: sleep 30

      - name: Retry GitHub Pages redeploy
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-explainer

      # Steps above never fail the job, so surface a missed deploy as a run annotation.
      - name: Warn if explainer was not deployed
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 1
        run: echo "::warning title=Breadth explainer::Pages redeploy failed twice; the site still shows the previous explainer."
