name: Daily Market Breadth Analysis

on:
  schedule:
    # Pre-market: ~4:00 AM West Coast (11:00 UTC)
    - cron: '0 11 * * 1-5'
    # Post-market: ~2:00 PM PST / 3:00 PM PDT (22:00 UTC)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Enable manual execution

# Set required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  keepalive:
    # Independent of analysis/deployment failures; only the default branch may write.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Keep scheduled workflow active
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/keep_workflow_active.sh "$DEFAULT_BRANCH"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --ignore-installed PyQt5

    - name: Generate and validate fresh publication
      env:
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: >-
        python scripts/publish_market_breadth.py
        --output-dir "$RUNNER_TEMP/market-breadth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

    - name: Upload validation diagnostic
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: publication-validation
        path: ${{ runner.temp }}/market-breadth-${{ github.run_id }}-${{ github.run_attempt }}/validation.json
        if-no-files-found: warn
        retention-days: 7

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ runner.temp }}/market-breadth-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
