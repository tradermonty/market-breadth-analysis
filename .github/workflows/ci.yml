name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'requirements.txt'
      - 'scripts/**'
      - 'security/**'
      - '.secrets.baseline'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        # Pin ruff: newer versions reformat Markdown code blocks in README/CLAUDE/docs,
        # which the repository has not been formatted against. Keeping the version fixed
        # keeps the format check deterministic without unrelated doc churn.
        run: pip install ruff==0.9.6 codespell tomli mypy pandas-stubs types-requests types-tqdm

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy --config-file pyproject.toml

      - name: Codespell
        run: codespell

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install bandit pip-audit detect-secrets

      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r . --exclude archive,venv311,tests

      # Gate 1: dependency vulnerabilities. pip-audit exits 1 when findings
      # exist, so its exit code is captured and passed to the gate script
      # (which always runs): codes 0/1 with valid JSON are classified against
      # the reviewed, dated allowlist; codes >1 (incl. network errors) and
      # malformed/empty output fail the step via SCANNER-FAILURE/
      # MALFORMED-INPUT. No bypass path.
      - name: pip-audit (enforced)
        run: |-
          pip-audit -r requirements.txt --format json > "$RUNNER_TEMP/pip_audit.json"
          code=$?
          echo "pip-audit exit code: $code"
          python scripts/security_gate.py pip-audit "$RUNNER_TEMP/pip_audit.json" \
            --allowlist security/pip-audit-allowlist.toml \
            --scanner-code "$code"

      # Gate 2: new secrets. The exclude set here must stay identical to the
      # one used to generate/update .secrets.baseline (its filters_used carry
      # the same patterns). The pre-commit hook scans only staged files and
      # does not use these excludes, so CI is the authoritative full-tree
      # gate. A nonzero detect-secrets exit fails the step; the script then
      # rejects findings that are not in the baseline. Raw secret values are
      # never printed by the gate script.
      - name: Detect secrets (enforced)
        run: >-
          detect-secrets scan
          --exclude-files '\.git/.*'
          --exclude-files '\.secrets\.baseline'
          --exclude-files 'venv311/.*'
          --exclude-files 'archive/.*'
          --exclude-files 'data/.*'
          --exclude-files 'trade/.*\.log'
          --exclude-files 'tests/fixtures/security/.*\.json'
          > "$RUNNER_TEMP/live_scan.json"
          && python scripts/security_gate.py secrets-check "$RUNNER_TEMP/live_scan.json"
          --baseline .secrets.baseline

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SKIP_API_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --ignore-installed PyQt5

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
