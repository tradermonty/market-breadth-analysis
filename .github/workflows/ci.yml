name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
      - '.python-version'
      - '.pre-commit-config.yaml'
      - 'requirements.txt'
      - 'requirements-analysis.txt'
      - 'requirements-lint-tools.txt'
      - 'requirements-security-tools.txt'
      - 'scripts/**'
      - 'security/**'
      - '.secrets.baseline'
      - 'web/**'
      - 'reports/*.html'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/market-breadth-env" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"

      - name: Install tools
        # Pinned, version-parity-gated tool set (see requirements-lint-tools.txt
        # header for the source-of-truth + update procedure; ruff rationale:
        # repo is formatted under 0.9.6; newer versions disagree).
        run: |
          uv sync --locked --only-group lint
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Tool parity checks
        run: python -m pytest tests/test_ci_tool_versions.py -q

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy --config-file pyproject.toml

      - name: Codespell
        run: codespell

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/market-breadth-env" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"

      - name: Install tools
        # Pinned, version-parity-gated tool set (see requirements-security-tools.txt
        # header for the source-of-truth + update procedure).
        run: |
          uv sync --locked --only-group security
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Tool parity checks
        run: python -m pytest tests/test_ci_tool_versions.py -q

      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r . --exclude archive,venv311,tests

      # Gate 1: dependency vulnerabilities. pip-audit exits 1 when findings
      # exist, so its exit code is captured and passed to the gate script
      # (which always runs): codes 0/1 with valid JSON are classified against
      # the reviewed, dated allowlist; codes >1 (incl. network errors) and
      # malformed/empty output fail the step via SCANNER-FAILURE/
      # MALFORMED-INPUT. No bypass path.
      - name: pip-audit (enforced)
        run: |-
          code=0
          pip-audit -r requirements.txt --format json > "$RUNNER_TEMP/pip_audit.json" || code=$?
          echo "pip-audit exit code: $code"
          python scripts/security_gate.py pip-audit "$RUNNER_TEMP/pip_audit.json" \
            --allowlist security/pip-audit-allowlist.toml \
            --scanner-code "$code"

      - name: Audit locked production analysis profile (enforced)
        run: |-
          python scripts/check_dependencies.py
          code=0
          pip-audit -r requirements-analysis.txt --format json > "$RUNNER_TEMP/pip_audit_analysis.json" || code=$?
          python scripts/security_gate.py pip-audit "$RUNNER_TEMP/pip_audit_analysis.json" \
            --allowlist security/pip-audit-analysis-allowlist.toml \
            --scanner-code "$code"

      # Gate 2: new secrets. The exclude set here must stay identical to the
      # one used to generate/update .secrets.baseline (its filters_used carry
      # the same patterns). The pre-commit hook scans only staged files and
      # does not use these excludes, so CI is the authoritative full-tree
      # gate. A nonzero detect-secrets exit fails the step; the script then
      # rejects findings that are not in the baseline. Raw secret values are
      # never printed by the gate script.
      - name: Detect secrets (enforced)
        run: >-
          detect-secrets scan
          --exclude-files '\.git/.*'
          --exclude-files '\.secrets\.baseline'
          --exclude-files 'venv311/.*'
          --exclude-files 'archive/.*'
          --exclude-files 'data/.*'
          --exclude-files 'trade/.*\.log'
          --exclude-files 'tests/fixtures/security/.*\.json'
          > "$RUNNER_TEMP/live_scan.json"
          && python scripts/security_gate.py secrets-check "$RUNNER_TEMP/live_scan.json"
          --baseline .secrets.baseline

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      SKIP_API_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/market-breadth-env" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"

      - name: Check dependency lock and export
        run: python scripts/check_dependencies.py

      - name: Verify clean core analysis without optional packages
        run: |
          uv sync --locked --no-default-groups
          "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/smoke_headless.py
          rm -rf "$UV_PROJECT_ENVIRONMENT"

      - name: Install dependencies reproducibly
        run: |
          uv sync --locked --extra trading --group test
          uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python" > "$RUNNER_TEMP/environment-first.txt"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/market-breadth-second" uv sync --locked --extra trading --group test
          uv pip freeze --python "$RUNNER_TEMP/market-breadth-second/bin/python" > "$RUNNER_TEMP/environment-second.txt"
          diff -u "$RUNNER_TEMP/environment-first.txt" "$RUNNER_TEMP/environment-second.txt"
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Upload resolved environment evidence
        uses: actions/upload-artifact@v4
        with:
          name: installed-packages-${{ matrix.os }}
          path: ${{ runner.temp }}/environment-*.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
